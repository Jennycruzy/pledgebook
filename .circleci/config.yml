version: 2.1

jobs:
  checks:
    docker:
      - image: cimg/python:3.11-node
    steps:
      - checkout
      - run:
          name: Install Python dependencies
          command: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - run:
          name: Run Python tests
          command: python -m pytest -q
      - run:
          name: Compile Python sources
          command: python -m compileall -q app scripts
      - run:
          name: Check browser JavaScript
          command: node --check web/app.js && node --check web/pay.js

workflows:
  checks:
    jobs:
      - checks
